<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Jacquard loom punch-card grid motif — represents programmable patterns -->
  <rect x="4" y="4" width="56" height="56" rx="8" fill="#1e293b"/>
  
  <!-- Grid lines (the loom threads) -->
  <line x1="20" y1="4" x2="20" y2="60" stroke="#334155" stroke-width="1"/>
  <line x1="32" y1="4" x2="32" y2="60" stroke="#334155" stroke-width="1"/>
  <line x1="44" y1="4" x2="44" y2="60" stroke="#334155" stroke-width="1"/>
  <line x1="4" y1="20" x2="60" y2="20" stroke="#334155" stroke-width="1"/>
  <line x1="4" y1="32" x2="60" y2="32" stroke="#334155" stroke-width="1"/>
  <line x1="4" y1="44" x2="60" y2="44" stroke="#334155" stroke-width="1"/>
  
  <!-- Punch card holes (the program) — amber accent -->
  <circle cx="20" cy="20" r="4" fill="#d97706"/>
  <circle cx="44" cy="20" r="4" fill="#d97706"/>
  <circle cx="32" cy="32" r="4" fill="#d97706"/>
  <circle cx="20" cy="44" r="4" fill="#d97706"/>
  <circle cx="44" cy="44" r="4" fill="#d97706"/>
  
  <!-- Connection lines between holes (the woven pattern) -->
  <line x1="20" y1="20" x2="32" y2="32" stroke="#d97706" stroke-width="1.5" opacity="0.6"/>
  <line x1="44" y1="20" x2="32" y2="32" stroke="#d97706" stroke-width="1.5" opacity="0.6"/>
  <line x1="32" y1="32" x2="20" y2="44" stroke="#d97706" stroke-width="1.5" opacity="0.6"/>
  <line x1="32" y1="32" x2="44" y2="44" stroke="#d97706" stroke-width="1.5" opacity="0.6"/>
  
  <!-- J letterform subtly integrated -->
  <text x="32" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle" opacity="0.15">J</text>
</svg>
